  .btn-block{width:100%;}

  /* -------- Problem/Solution -------- */

  /* -------- Card grids -------- */

  .feat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:24px;

  .feat-card:hover{transform:translateY(-4px); border-color:var(--blue);}
  .feat-icon{

    background:linear-gradient(135deg, rgba(59,123,250,0.18), rgba(155,107,250,0.18)); border:1px solid var(--line);
  }
  .feat-icon svg{width:22px; height:22px; color:var(--cyan);}
  .feat-card h4{font-family:var(--font-head); font-size:15.5px; color:#fff; margin-bottom:8px; font-weight:600;}
  .feat-card p{font-size:13px; color:var(--text-dim); line-height:1.6;}

  /* -------- Benefits -------- */
  section.benefits{background:var(--bg-deep); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .benefit-card{
    display:flex; gap:14px; align-items:flex-start; background:var(--surface);

  .benefit-card p{font-size:13px; color:var(--text-dim); line-height:1.55;}

  /* -------- Product preview -------- */
  .preview-grid{display:grid; grid-template-columns:0.85fr 1.15fr; gap:54px; align-items:center;}
  @media (max-width:900px){ .preview-grid{grid-template-columns:1fr;} }
  .preview-img-frame{
    border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line);

  section.offer{position:relative;}

  .offer-badge-row{display:flex; justify-content:center; margin-bottom:20px;}
  .offer-card h3{font-family:var(--font-head); font-size:22px; color:#fff; text-align:center; font-weight:700;}

  .offer-includes svg{width:18px; height:18px; color:var(--success); flex:none; margin-top:2px;}
  .offer-includes b{color:#fff;}
  .price-block{text-align:center; margin:28px 0 8px 0;}
  .price-old{font-size:16px; color:var(--strike); text-decoration:line-through; margin-bottom:2px;}

  .price-note{text-align:center; font-size:12.5px; color:var(--text-faint); margin-bottom:26px;}
  .offer-urgency{
    display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; color:var(--cyan); font-weight:600;
    margin-bottom:22px;
  }
  .secure-line{text-align:center; margin-top:16px; font-size:12.5px; color:var(--text-faint);}

  /* -------- FAQ -------- */
  .faq-item{border-top:1px solid var(--line); padding:20px 0;}
  .faq-item:last-child{border-bottom:1px solid var(--line);}
  .faq-item summary{
    cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:16px;
    font-family:var(--font-head); font-size:16px; color:#fff; font-weight:600;
  }
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary .plus{font-size:22px; color:var(--cyan); font-weight:300; transition:transform .2s ease; flex:none;}
  .faq-item[open] summary .plus{transform:rotate(45deg);}
  .faq-item p{margin-top:12px; font-size:14px; color:var(--text-dim); line-height:1.7; max-width:720px;}

  /* -------- Final CTA -------- */
  section.finalcta{
    text-align:center; position:relative;
    background:linear-gradient(160deg, var(--surface), var(--bg-deep));
    border-top:1px solid var(--line);
  }
  section.finalcta h2{font-family:var(--font-head); font-size:clamp(26px,4vw,42px); color:#fff; font-weight:700; max-width:680px; margin:0 auto 16px auto; line-height:1.2;}
  section.finalcta p{color:var(--text-dim); font-size:15.5px; max-width:480px; margin:0 auto 30px auto;}

  /* -------- Footer -------- */
  footer{background:var(--bg-deep); border-top:1px solid var(--line); padding:48px 0 100px 0; font-size:13px; color:var(--text-faint);}
  @media (min-width:721px){ footer{padding-bottom:48px;} }
  .foot-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; padding-bottom:26px; border-bottom:1px solid var(--line);}
  .foot-bottom{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-top:20px;}

  /* -------- Sticky mobile bottom CTA -------- */
  .mobile-sticky{
    position:fixed; left:0; right:0; bottom:0; z-index:200;
    background:rgba(10,14,27,0.94); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px 16px; display:none; align-items:center; justify-content:space-between; gap:12px;
  }
  .mobile-sticky .price{font-family:var(--font-head); font-weight:700; color:#fff; font-size:17px;}
  .mobile-sticky .price small{display:block; font-size:10.5px; color:var(--text-faint); font-weight:500; text-decoration:line-through;}
  @media (max-width:720px){ .mobile-sticky{display:flex;} body{padding-bottom:78px;} }

  /* -------- Hero entrance animation (safe: pure CSS, no JS dependency) -------- */
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .hero-grid > *{animation:fadeUp .7s ease both;}
  .hero-grid > *:nth-child(2){animation-delay:.12s;}
  @media (prefers-reduced-motion: reduce){
    .hero-grid > *{animation:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
